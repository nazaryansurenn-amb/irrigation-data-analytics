[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Syntax errors, undefined names, unused imports, redefinitions and comparison
# mistakes. Selected explicitly so the check stays stable across ruff releases.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
